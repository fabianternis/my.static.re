name = "my-api-static-re"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom Domain mapping for Worker
routes = [
  { pattern = "my-api.static.re", custom_domain = true }
]

# R2 Bucket bindings
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "my-static-re"

# Observability and Logs
[observability]
enabled = true

# Environment variables
[vars]
ENVIRONMENT = "production"
PUBLIC_ASSET_BASE_URL = "https://my.static.re"
R2_BUCKET_NAME = "my-static-re"
API_KEY = "secret-passphrase-xyz123"
