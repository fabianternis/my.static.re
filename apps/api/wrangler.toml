name = "my-api-static-re"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom Domain mapping for Worker
routes = [
  { pattern = "my-api.static.re", custom_domain = true }
]

# R2 Bucket bindings
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "my-static-re"

# Observability and Logs
[observability]
enabled = true

# Environment variables
[vars]
ENVIRONMENT = "production"
PUBLIC_ASSET_BASE_URL = "https://my.static.re"
R2_BUCKET_NAME = "my-static-re"

# Required Secrets (set via Cloudflare Dashboard or `wrangler secret put <KEY>`):
# - API_KEY: Secret key for authorizing private API access
# - R2_ACCOUNT_ID: Cloudflare Account ID for S3 presigned URL generation
# - R2_ACCESS_KEY_ID: Cloudflare R2 API token Access Key ID
# - R2_SECRET_ACCESS_KEY: Cloudflare R2 API token Secret Access Key
